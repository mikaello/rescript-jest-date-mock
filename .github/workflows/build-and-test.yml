name: Build and test 🔧💉

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
    - run: npm ci
    - name: Run the tests 👀
      run: npm test
